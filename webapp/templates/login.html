<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Login - CTU Solutions</title>
  
  <link rel="stylesheet" href="/websitename/static/login.style.css">
</head>
<body>

  <div class="login-container">
    
    <div class="logo">
      <h1>CTU Portal</h1>
      <p>Secure Live Environment</p>
    </div>

    <h2>Sign In</h2>
    
    <form action="./login" method="POST">
      
      <div class="input-group">
        <label for="username">Username / Student Number</label>
        <input type="text" id="username" name="username" required placeholder="e.g., ST123456">
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Enter password">
      </div>

      <div class="input-group">
        <label for="totp_token">MFA Security Code (TOTP)</label>
        <input 
          type="text" 
          id="totp_token" 
          name="totp_token" 
          required 
          maxlength="6" 
          minlength="6"
          pattern="[0-9]{6}" 
          inputmode="numeric"
          oninput="this.value = this.value.replace(/[^0-9]/g, '');"
          placeholder="000 000"
      >
</div>

      <button type="submit" class="btn">Log In Securely</button>
    </form>

    <div class="forgot-password">
      <a href="#">Forgot Password?</a>
    </div>

    <div class="footer">
      <p>&copy; 2026 CTU Training Solutions. All rights reserved.</p>
    </div>

  </div>

</body>
</html>
