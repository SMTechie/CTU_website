<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MFA Security Setup - CTU Solutions</title>
    <link rel="stylesheet" href="/websitename/static/login.style.css">
    <style>
        .qr-container {
            background: white;
            padding: 15px;
            border-radius: 8px;
            display: inline-block;
            margin: 20px auto;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
        }
        .qr-container img {
            display: block;
            max-width: 180px;
            height: auto;
        }
        .setup-instructions {
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 10px;
            line-height: 1.5;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card" style="text-align: center;">
            <h2>MFA Activation</h2>
            <p class="setup-instructions">
                Scan this QR code using <strong>Google Authenticator</strong> or <strong>Microsoft Authenticator</strong> on your phone.
            </p>

            <div class="qr-container">
                <img src="data:image/png;base64,{{ qr_base64 }}" alt="MFA QR Verification Matrix">
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash-{{ category }}" style="color: #d9534f; background-color: #f2dede; border: 1px solid #ebccd1; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-weight: bold; font-size: 0.85rem;">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="/mfa/setup/confirm" method="POST" style="text-align: left;">
                <div class="form-group">
                    <label for="mfa_code">Enter 6-Digit Verification Token</label>
                    <input 
                        type="text" 
                        id="mfa_code" 
                        name="mfa_code" 
                        placeholder="000000" 
                        maxlength="6" 
                        required 
                        autocomplete="off"
                        style="text-align: center; font-size: 1.2rem; letter-spacing: 4px;"
                    >
                </div>
                
                <button type="submit" class="btn-submit">Verify & Link Device</button>
            </form>
        </div>
    </div>
</body>
</html>
