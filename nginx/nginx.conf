events { }

http {
    include mime.types;

    server {
        listen 443 ssl;

        ssl_certificate         /etc/nginx/certs/serverkey.crt;
        ssl_certificate_key     /etc/nginx/certs/serverkey.key;

        # Web App 1
        location /websitename/ {
            proxy_pass http://webapp1:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Web App 2 (portal)
        location /websitename/portal/ {
            proxy_pass http://webapp2:3001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /websitename/static/ {
            proxy_pass http://webapp2:3001/static/;
        }

        location /login {
            proxy_pass http://webapp2:3001/login;
        }

        location /logout{
            proxy_pass http://webapp2:3001/logout;
        }

        location /tickets {
            proxy_pass http://webapp2:3001/tickets;
        }

        location /mfa {
            proxy_pass http://webapp2:3001/mfa;
        }
    }
}