<!DOCTYPE html>
<html lang="en">
<head>
    <title>CRM</title>
    <link rel="stylesheet" href="/static/css/dashboardnavbars.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <h4 class="text-center mb-4">CTU Panel</h4>
        <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint=='dashboard' %}active{% endif %}">
            Dashboard
        </a>
        <a href="{{ url_for('tickets') }}" class="{% if request.endpoint=='tickets' %}active{% endif %}">
            Tickets
        </a>
        <a href="{{ url_for('users') }}" class="{% if request.endpoint=='users' %}active{% endif %}">
            Users
        </a>
    </div>

    <!-- Top Navbar -->
    <div class="topbar">
        <div class="fw-bold">Admin Dashboard</div>
        <div class="ms-auto d-flex align-items-center gap-3">
            <span class="text-muted">Welcome back</span>
            <div class="dropdown">
                <button class="btn btn-sm btn-outline-primary dropdown-toggle" data-bs-toggle="dropdown">
                    Account
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="">Profile</a></li>
                    <li><a class="dropdown-item" href="">Settings</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger" href="{{ url_for('logout')}}">Logout</a></li>
                </ul>
            </div>
        </div>
    </div>
    
    <!-- Page Content-->
     <div class="main-content">
        {% block content %}{% endblock %}
     </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
